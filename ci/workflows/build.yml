name: NOVA OS Continuous Integration & Release Pipeline

on:
  push:
    branches: [main, 'feature/**', 'release/**']
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  rust-workspace-check:
    name: Rust Crates Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libssl-dev pkg-config
      - name: Cargo Check Workspace
        run: cargo check --workspace --all-targets
      - name: Cargo Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Cargo Test
        run: cargo test --workspace

  desktop-shell-ci:
    name: Desktop Shell Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: desktop/shell/pnpm-lock.yaml
      - name: Install Dependencies
        working-directory: desktop/shell
        run: pnpm install --no-frozen-lockfile
      - name: Run Vitest Unit Tests
        working-directory: desktop/shell
        run: pnpm test -- --run
      - name: Build Web Desktop Shell
        working-directory: desktop/shell
        run: pnpm run build

  python-integration-and-iso-verification:
    name: Integration Tests & ISO Verification
    runs-on: ubuntu-latest
    needs: [rust-workspace-check, desktop-shell-ci]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pycdlib
        run: pip install pycdlib
      - name: Build Bootable ISO
        run: python scripts/build_iso.py
      - name: Run Full Integration & Security Test Suite
        run: python -m unittest discover -s tests/integration -p "test_*.py" -v

  publish-github-release:
    name: Publish Release Artifacts
    runs-on: ubuntu-latest
    needs: [python-integration-and-iso-verification]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pycdlib
        run: pip install pycdlib
      - name: Build ISO & Checksums
        run: python scripts/build_iso.py
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: NOVA OS ${{ github.ref_name }}
          body_path: docs/RELEASE_NOTES_${{ github.ref_name }}.md
          files: |
            dist/release-${{ github.ref_name }}/nova-os-*.iso
            dist/release-${{ github.ref_name }}/SHA256SUMS
            dist/release-${{ github.ref_name }}/SHA512SUMS
            dist/release-${{ github.ref_name }}/release-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
