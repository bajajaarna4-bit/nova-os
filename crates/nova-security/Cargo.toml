[package]
name = "nova-security"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nova-security"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = "4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
nova-system-api = { path = "../nova-system-api" }
nova-audit = { path = "../nova-audit" }
